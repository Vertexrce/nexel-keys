<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexel</title>
<link rel="stylesheet" href="./style.css" />
<style>
  :root {
    --bg: #03060f;
    --panel: #070d1b;
    --line: #14243d;
    --text: #cfe6ff;
    --dim: #5d7799;
    --accent: #2fb6ff;
    --ok: #35d39a;
    --bad: #ff5f6d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  #titlebar {
    height: 38px;
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 0 16px;
    border-bottom: 1px solid var(--line);
    background: #050a14;
    -webkit-app-region: drag;
    user-select: none;
  }
  .brand {
    letter-spacing: .28em;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .winbtns { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  .winbtns button {
    width: 34px;
    height: 26px;
    border: 0;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
  }
  .winbtns button:hover { background: #12203a; color: var(--text); }
  #btn-close:hover { background: var(--bad); color: #fff; }

  main {
    flex: 1;
    overflow: auto;
    padding: 28px 32px 40px;
    display: flex;
    justify-content: center;
  }
  .shell { width: 100%; max-width: 720px; }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .sub { margin: 0 0 24px; color: var(--dim); }

  .card {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #040913;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }

  button.act {
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #0b1526;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.act:hover { border-color: var(--accent); }
  button.act:disabled { opacity: .45; cursor: default; border-color: var(--line); }

  #btn-launch {
    flex: 1;
    padding: 13px 16px;
    font-size: 14px;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #1b6fb0, #12456e);
    border-color: #2b8fd8;
    color: #eaf7ff;
  }
  #btn-launch:hover:not(:disabled) { background: linear-gradient(180deg, #2284cd, #17547f); }

  #game-path {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--dim);
    font-size: 12px;
    direction: rtl;
    text-align: left;
  }

  label.check {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
  }
  label.check input { accent-color: var(--accent); width: 15px; height: 15px; }
  label.check small { display: block; color: var(--dim); font-size: 11px; }

  #log {
    margin: 0;
    height: 210px;
    overflow: auto;
    padding: 12px;
    background: #02050c;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 11px/1.6 Consolas, monospace;
    color: #8fb8d8;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .msg { min-height: 18px; font-size: 12px; }
  .msg.bad { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  #gate { display: none; }
  #app { display: none; }

  .epic-label { font-size: 12px; color: var(--dim); }
  .epic-code {
    font: 600 20px Consolas, monospace;
    letter-spacing: .18em;
    color: var(--accent);
    margin: 8px 0;
  }
  .epic-btn {
    margin-top: 8px;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #0b1526;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  .epic-btn:hover { border-color: var(--accent); }
</style>
</head>
<body>

<div id="titlebar">
  <div class="brand">Nexel</div>
  <div class="winbtns">
    <button id="btn-min" title="Minimize">&#8211;</button>
    <button id="btn-close" title="Close">&#10005;</button>
  </div>
</div>

<main>
  <div class="shell">

    <section id="gate">
      <h1>Sign in</h1>
      <p class="sub">Discord login, then redeem your key.</p>

      <div class="card">
        <h2>Account</h2>
        <div class="row">
          <button class="act" id="btn-login">Continue with Discord</button>
        </div>
        <div class="row">
          <input type="text" id="key-input" placeholder="NEXEL-XXXX-XXXX-XXXX" autocomplete="off" />
          <button class="act" id="btn-redeem">Redeem</button>
        </div>
        <div class="row"><div class="msg" id="gate-msg"></div></div>
      </div>
    </section>

    <section id="app">
      <h1>Fortnite</h1>
      <p class="sub" id="welcome">Ready.</p>

      <div class="card">
        <h2>Epic account</h2>
        <div id="epic-panel"></div>
      </div>

      <div class="card">
        <h2>Install</h2>
        <div class="row">
          <span id="game-path">No executable selected</span>
        </div>
        <div class="row">
          <button class="act" id="btn-detect">Auto-detect</button>
          <button class="act" id="btn-pick">Browse</button>
        </div>
        <div class="row"><div class="msg" id="game-msg"></div></div>
      </div>

      <div class="card">
        <h2>Launch</h2>
        <div class="row">
          <label class="check">
            <input type="checkbox" id="skip-eac" checked />
            <span>Skip EAC
              <small>Runs the shipping binary directly. EAC never starts, but some modes complain.</small>
            </span>
          </label>
        </div>
        <div class="row">
          <button class="act" id="btn-launch">Launch</button>
          <button class="act" id="btn-stop">Stop</button>
        </div>
        <div class="row"><div class="msg" id="launch-msg"></div></div>
      </div>

      <div class="card">
        <h2>Output</h2>
        <pre id="log"></pre>
      </div>
    </section>

  </div>
</main>

<script src="./epic.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const gate = $('gate');
  const appEl = $('app');
  const logEl = $('log');
  let sessionCheck = null;

  const log = (text) => {
    logEl.textContent += text;
    logEl.scrollTop = logEl.scrollHeight;
  };

  const setMsg = (el, text, kind) => {
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  };

  $('btn-min').onclick = () => window.nexel.minimize();
  $('btn-close').onclick = () => window.nexel.close();

  const REASONS = {
    NO_SESSION: 'Sign in again.',
    EXPIRED: 'Key expired — redeem a new one.',
    KEY_PAUSED: 'Key paused by an admin.',
    KEY_DELETED: 'Key was deleted.',
    KEY_REVOKED: 'Key was revoked.',
    OFFLINE: 'Cannot reach the server.',
    TARGET_MISSING: 'Set the game executable first.',
    LAUNCH_FAILED: 'The game refused to start.',
    NOT_FOUND: 'Fortnite not found — browse for it.'
  };

  const describe = (reason) => REASONS[reason] || reason || 'Unknown error.';

  function enterApp() {
    gate.style.display = 'none';
    appEl.style.display = 'block';
    if (sessionCheck) clearInterval(sessionCheck);
    sessionCheck = setInterval(async () => {
      const r = await window.nexel.checkSession();
      if (!r.ok) {
        clearInterval(sessionCheck);
        sessionCheck = null;
        await window.nexel.logout();
        gate.style.display = 'block';
        appEl.style.display = 'none';
        setMsg($('gate-msg'), describe(r.reason), 'bad');
      }
    }, 30000);
  }

  async function refreshPath() {
    const cfg = await window.nexel.cfgGet();
    $('game-path').textContent = cfg.target || 'No executable selected';
    if (cfg.target) $('game-path').title = cfg.target;
    $('skip-eac').checked = cfg.mode !== 'eac';
  }

  $('btn-login').onclick = async () => {
    setMsg($('gate-msg'), 'Waiting for browser…');
    const r = await window.nexel.login();
    if (!r.ok) return setMsg($('gate-msg'), describe(r.reason), 'bad');
    setMsg($('gate-msg'), '');
    enterApp();
    refreshPath();
  };

  $('btn-redeem').onclick = async () => {
    const key = $('key-input').value.trim();
    if (!key) return;
    setMsg($('gate-msg'), 'Checking key…');
    const r = await window.nexel.redeem(key);
    if (!r.ok) return setMsg($('gate-msg'), describe(r.reason), 'bad');
    $('key-input').value = '';
    setMsg($('gate-msg'), '');
    enterApp();
    refreshPath();
  };

  $('btn-detect').onclick = async () => {
    const r = await window.nexel.detect();
    if (!r.ok) return setMsg($('game-msg'), describe(r.reason), 'bad');
    setMsg($('game-msg'), r.hasBootstrapper ? '' : 'No bootstrapper found — EAC mode will use the shipping binary.', 'ok');
    refreshPath();
  };

  $('btn-pick').onclick = async () => {
    const picked = await window.nexel.pickExe();
    if (!picked) return;
    setMsg($('game-msg'), '');
    refreshPath();
  };

  $('skip-eac').onchange = async () => {
    await window.nexel.cfgSet({ mode: $('skip-eac').checked ? 'noeac' : 'eac' });
  };

  $('btn-launch').onclick = async () => {
    const btn = $('btn-launch');
    btn.disabled = true;
    setMsg($('launch-msg'), 'Launching…');
    logEl.textContent = '';
    const mode = $('skip-eac').checked ? 'noeac' : 'eac';
    const r = await window.nexel.launch({ mode });
    if (!r.ok) {
      btn.disabled = false;
      return setMsg($('launch-msg'), describe(r.reason), 'bad');
    }
    setMsg($('launch-msg'), r.authed ? 'Running.' : 'Running — no Epic login, sign-in screen expected.', r.authed ? 'ok' : 'bad');
  };

  $('btn-stop').onclick = async () => {
    await window.nexel.stop();
    $('btn-launch').disabled = false;
    setMsg($('launch-msg'), 'Stopped.');
  };

  window.nexel.onLaunchOut(log);
  window.nexel.onLaunchExit((code) => {
    $('btn-launch').disabled = false;
    setMsg($('launch-msg'), `Exited (${code}).`, code === 0 ? 'ok' : 'bad');
  });

  (async () => {
    const r = await window.nexel.restore();
    if (!r.ok) {
      gate.style.display = 'block';
      if (r.reason && r.reason !== 'NO_SESSION') setMsg($('gate-msg'), describe(r.reason), 'bad');
      return;
    }
    enterApp();
    refreshPath();
  })();
</script>
</body>
</html>
